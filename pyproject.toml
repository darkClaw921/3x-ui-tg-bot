[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-vpn-bot"
version = "0.1.0"
description = "Telegram bot for managing 3x-ui VPN subscriptions (Stars payments, promocodes, admin panel)"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "igorgerasimov" },
]
license = { text = "MIT" }
keywords = ["telegram", "bot", "aiogram", "3x-ui", "vpn", "xray"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "aiogram>=3.4",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "qrcode[pil]>=7.4",
    "APScheduler>=3.10",
    "pydantic-settings>=2.3",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "Pillow>=10.0",
    "respx>=0.21",
    "ruff>=0.4",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "Pillow>=10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
